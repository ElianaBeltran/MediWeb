<!DOCTYPE html>
<html lang="zxx">
<head>
	<title>The Plaza - eCommerce Template</title>
	<meta charset="UTF-8">
	<meta name="description" content="The Plaza eCommerce Template">
	<meta name="keywords" content="plaza, eCommerce, creative, html">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Favicon -->
	<link href="img/favicon.ico" rel="shortcut icon"/>

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css?family=Raleway:400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

	<!-- Stylesheets -->
	<link rel="stylesheet" href="css/bootstrap.min.css"/>
	<link rel="stylesheet" href="css/font-awesome.min.css"/>
	<link rel="stylesheet" href="css/owl.carousel.css"/>
	<link rel="stylesheet" href="css/style.css"/>
	<link rel="stylesheet" href="css/animate.css"/>
	<script src="https://sandbox.paypal.com/sdk/js?client-id=AS0PHVhR8T0njVHPz4bNedrPL9NzhmL-dfpUbHe56344lak6_dmzjbCBSE9cHoE2F29UjK1smAOeZ6a9"></script>

	<!--[if lt IE 9]>
	  <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
	  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
	<![endif]-->

</head>
<body>
	<!-- Page Preloder -->
	<div id="preloder">
		<div class="loader"></div>
	</div>

	<!-- Header section -->
	<header class="header-section header-normal">
		<img src="/img/imagelogo.png" class="logo">
	</header>
	<!-- Header section end -->



	<!-- Page -->
	<div class="page-area cart-page spad">
		<div class="container">
			<form class="checkout-form center">
				<div class="row card-div">
					<div class="col-lg-6">
						<div class="order-card">
							<div class="order-details">
								<div class="od-warp">
									<h4 class="checkout-title">Detalle de consulta</h4>
									<table class="order-table">
										<thead>
											<tr>
												<th>Consulta</th>
												<th>Total</th>
											</tr>
										</thead>
										<tbody>
											<tr>
												<td>Coste de servicio</td>
												<td id="costo"></td>
											</tr>
											<tr>
												<td>Impuesto</td>
												<td id="imp"></td>
											</tr>
									
										</tbody>
										<tfoot>
											<tr class="order-total">
												<th>Total</th>
												<th id="total"></th>
											</tr>
										</tfoot>
									</table>
								</div>
							</div>
							<div id="paypal-button-container">
								
							</div>
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>
	<!-- Page -->


	<!--====== Javascripts & Jquery ======-->
	<script src="js/checkout.js"></script>
	<script src="js/paypal.js"></script>
	<script src="js/jquery-3.2.1.min.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/owl.carousel.min.js"></script> 
	<script src="js/mixitup.min.js"></script>
	<script src="js/sly.min.js"></script>
	<script src="js/jquery.nicescroll.min.js"></script>
	<script src="js/main.js"></script>
    </body>
</html>
